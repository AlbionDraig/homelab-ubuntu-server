services:
  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail

    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      - /var/log:/var/log

    command: -config.file=/etc/promtail/config.yml

    networks:
      - proxy

    restart: unless-stopped

networks:
  proxy:
    external: true
