services:
  grafana:
    image: grafana/grafana:11.0.0
    container_name: grafana

    ports:
      - "3000:3000"

    volumes:
      - grafana-data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro

    networks:
      - proxy

    restart: unless-stopped

volumes:
  grafana-data:

networks:
  proxy:
    external: true
