services:
  loki:
    image: grafana/loki:3.0.0
    container_name: loki

    ports:
      - "3100:3100"

    command: -config.file=/etc/loki/loki-config.yml

    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml
      - loki-data:/loki

    restart: unless-stopped

    networks:
      - proxy

volumes:
  loki-data:

networks:
  proxy:
    external: true
