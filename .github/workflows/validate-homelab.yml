name: Validate Homelab

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-homelab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Docker Compose is available
        shell: bash
        run: docker compose version

      - name: Validate Bash script syntax
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t scripts < <(find scripts -name "*.sh" | sort)

          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "No Bash scripts found under scripts/"
            exit 0
          fi

          failed=0
          for script in "${scripts[@]}"; do
            echo "[BASH] Validating ${script}"
            if ! bash -n "${script}" 2>&1; then
              echo "[FAIL] Syntax error in ${script}"
              failed=1
            else
              echo "[OK]   ${script}"
            fi
          done

          if [ "$failed" -eq 1 ]; then
            echo "One or more Bash scripts failed syntax validation."
            exit 1
          fi

          echo "All Bash scripts passed syntax validation."

      - name: Validate Docker Compose syntax
        shell: bash
        run: |
          set -euo pipefail

          docker network create proxy 2>/dev/null || true

          mapfile -t compose_files < <(find docker -name "docker-compose.yml" | sort)

          if [ "${#compose_files[@]}" -eq 0 ]; then
            echo "No docker-compose.yml files found under docker/"
            exit 0
          fi

          failed=0
          for f in "${compose_files[@]}"; do
            echo "[COMPOSE] Validating $f"
            output=$(docker compose -f "$f" config 2>&1) || {
              echo "[FAIL] $f"
              echo "$output"
              failed=1
              continue
            }
            echo "[OK]   $f"
          done

          docker network rm proxy 2>/dev/null || true

          if [ "$failed" -eq 1 ]; then
            echo "One or more Compose files failed validation."
            exit 1
          fi

          echo "All Compose files passed validation."
