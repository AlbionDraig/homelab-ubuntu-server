name: Validate Homelab

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-homelab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Docker Compose is available
        shell: bash
        run: docker compose version

      - name: Validate Bash script syntax
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          scripts=(scripts/**/*.sh)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No Bash scripts found under scripts/**/*.sh"
            exit 0
          fi

          for script in "${scripts[@]}"; do
            echo "[BASH] Validating ${script}"
            bash -n "${script}"
          done

          echo "All Bash scripts passed syntax validation."

      - name: Validate Docker Compose syntax
        shell: bash
        run: |
          set -euo pipefail

          docker network create proxy || true

          failed=0
          while IFS= read -r f; do
            if docker compose -f "$f" config > /dev/null 2>&1; then
              echo "[OK]   $f"
            else
              echo "[FAIL] $f"
              failed=1
            fi
          done < <(find docker -name "docker-compose.yml" | sort)

          docker network rm proxy 2>/dev/null || true

          if [ "$failed" -eq 1 ]; then
            echo "One or more Compose files failed validation."
            exit 1
          fi

          echo "All Compose files passed validation."
