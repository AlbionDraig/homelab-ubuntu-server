name: Validate Homelab

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-homelab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Docker Compose is available
        shell: bash
        run: docker compose version

      - name: Validate Bash script syntax
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          scripts=(scripts/**/*.sh)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No Bash scripts found under scripts/**/*.sh"
            exit 0
          fi

          for script in "${scripts[@]}"; do
            echo "[BASH] Validating ${script}"
            bash -n "${script}"
          done

          echo "All Bash scripts passed syntax validation."

      - name: Validate Docker Compose syntax
        shell: bash
        run: bash scripts/validate_compose_all.sh
